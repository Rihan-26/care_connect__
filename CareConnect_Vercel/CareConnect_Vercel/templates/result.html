<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Connect - Analysis Result</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body{
            margin:0;
            padding:0;
            background:#f5f7fb;
            font-family:Arial, Helvetica, sans-serif;
        }

        .container{
            max-width:900px;
            margin:50px auto;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#555;
            margin-bottom:40px;
        }

        .button-container{
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
        }

        .option-card{
            width:300px;
            background:white;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
            padding:30px;
            text-align:center;
            transition:.3s;
        }

        .option-card:hover{
            transform:translateY(-6px);
        }

        .icon{
            font-size:60px;
            margin-bottom:20px;
        }

        .option-card h2{
            margin-bottom:10px;
            color:#222;
        }

        .option-card p{
            color:#666;
            margin-bottom:25px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:bold;
        }

        button:hover{
            background:#1d4ed8;
        }

        #doctorSection,
        #hospitalSection{
            display:none;
            margin-top:40px;
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }
    </style>

</head>

<body>

<div class="container">

    <h1>🩺 Analysis Complete</h1>

    <p class="subtitle">
        Choose what you would like to see next.
    </p>

    <div class="button-container">

        <div class="option-card">

            <div class="icon">👨‍⚕️</div>

            <h2>Recommended Doctor</h2>

            <p>
                View the specialist recommended based on your symptoms.
            </p>

            <button id="doctorBtn">
                View Doctor
            </button>

        </div>

        <div class="option-card">

            <div class="icon">🏥</div>

            <h2>Nearby Hospitals</h2>

            <p>
                Find hospitals near your current location.
            </p>

            <button id="hospitalBtn">
                View Hospitals
            </button>

        </div>

    </div>

    <div id="doctorSection"></div>

    <div id="hospitalSection"></div>

</div>

<script src="{{ url_for('static', filename='result.js') }}"></script>

</body>
</html>
